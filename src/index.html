<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>MingoMate</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", sans-serif; }
    /* Retina에서 setPixelRatio×setSize(updateStyle=false) 조합이면 캔버스 레이아웃이
       버퍼 픽셀(2×)로 커져 창에 반만 보이는 문제가 난다 → CSS로 창에 맞춤 */
    canvas#stage { display: block; width: 100vw; height: 100vh; }
    video#cam { position: fixed; left: -9999px; top: 0; width: 2px; height: 2px; opacity: 0; }

    /* 현재 캐릭터 칩 — 클릭/우클릭으로 전환 UI */
    #avatar-chip {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(12, 14, 22, 0.78);
      color: #f6f7ff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      user-select: none;
      -webkit-app-region: no-drag;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events: auto;
      white-space: nowrap;
    }
    #avatar-chip:hover { background: rgba(22, 26, 40, 0.9); border-color: rgba(255,255,255,0.55); }
    #avatar-chip .emoji { font-size: 15px; line-height: 1; }
    #avatar-chip .caret { opacity: 0.65; font-size: 10px; margin-left: 2px; }

    /* 인앱 캐릭터 그리드 피커 */
    #avatar-picker {
      position: fixed;
      left: 50%;
      bottom: 52px;
      transform: translateX(-50%);
      z-index: 60;
      width: min(320px, calc(100vw - 24px));
      padding: 10px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(10, 12, 20, 0.9);
      box-shadow: 0 16px 40px rgba(0,0,0,0.45);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: none;
      pointer-events: auto;
      -webkit-app-region: no-drag;
    }
    #avatar-picker.open { display: block; }
    #avatar-picker .title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: rgba(255,255,255,0.78);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 4px 8px;
    }
    #avatar-picker .title .hint { font-weight: 500; opacity: 0.55; text-transform: none; letter-spacing: 0; }
    #avatar-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    #avatar-grid button {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: #f4f6ff;
      border-radius: 12px;
      padding: 10px 6px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font: inherit;
      transition: background 0.12s ease, border-color 0.12s ease, transform 0.08s ease;
    }
    #avatar-grid button:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.3);
    }
    #avatar-grid button.active {
      background: rgba(120, 170, 255, 0.22);
      border-color: rgba(150, 190, 255, 0.7);
      box-shadow: inset 0 0 0 1px rgba(150, 190, 255, 0.25);
    }
    #avatar-grid button:active { transform: scale(0.97); }
    #avatar-grid .emoji { font-size: 22px; line-height: 1; }
    #avatar-grid .label { font-size: 12px; font-weight: 600; }
    #avatar-grid .key {
      font-size: 10px;
      opacity: 0.5;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>
</head>
<body>
  <video id="cam" playsinline muted></video>
  <canvas id="stage"></canvas>

  <div id="avatar-picker" aria-label="캐릭터 선택" role="dialog">
    <div class="title">
      <span>캐릭터</span>
      <span class="hint">우클릭=옵션 · C · 1–0</span>
    </div>
    <div id="avatar-grid"></div>
  </div>
  <button id="avatar-chip" type="button" title="캐릭터 바꾸기 (C / 우클릭)">
    <span class="emoji" id="chip-emoji">🦊</span>
    <span id="chip-label">여우</span>
    <span class="caret">▾</span>
  </button>

  <script type="module" src="./main.ts"></script>
</body>
</html>
