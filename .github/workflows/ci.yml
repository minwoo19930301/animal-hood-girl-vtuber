name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Rebuild and audit the 12-avatar pack
        run: |
          npm run avatars:build -- \
            --work-root "$RUNNER_TEMP/avatar-pack-work" \
            --output-root "$RUNNER_TEMP/avatar-pack-models"
          npm run avatars:audit -- \
            --work-root "$RUNNER_TEMP/avatar-pack-work"
